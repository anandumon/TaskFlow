name: TaskFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build & Verify Full-Stack Next.js (Serverless API + Frontend)
  # ─────────────────────────────────────────────────────────────
  nextjs-build:
    name: Build & Verify TaskFlow (Full-Stack Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'taskflow-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-security' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dxrcfczdfstnymbeicmq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        run: npm run build

      - name: Archive Next.js Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-build
          path: |
            apps/web/.next
            apps/web/public
          retention-days: 7

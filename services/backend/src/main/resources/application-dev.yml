spring:
  # ── Database ────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}${DB_PARAMS:}}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  # ── JPA Dev Settings ───────────────────────────────────
  jpa:
    show-sql: true

  # ── Redis ───────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ── Kafka ───────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    consumer:
      group-id: taskflow-backend
      auto-offset-reset: earliest
    producer:
      acks: all

# ── Logging ──────────────────────────────────────────────
logging:
  level:
    com.taskflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

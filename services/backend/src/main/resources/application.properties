# =============================================================================
# TaskFlow Application Properties
# =============================================================================
spring.application.name=taskflow-backend
server.port=8080

# ── Active Profile ───────────────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Local In-Memory H2 Database (Default Fallback) ───────────────────────────
spring.datasource.url=jdbc:h2:mem:taskflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA / Hibernate Settings ────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway Configuration ────────────────────────────────────────────────────
spring.flyway.enabled=false

# ── Jackson JSON Settings ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Actuator Endpoints ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.health.redis.enabled=false

# ── Security & JWT Settings ─────────────────────────────────────────────────
taskflow.jwt.secret=taskflow-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-security
taskflow.jwt.access-token-expiration=900000
taskflow.jwt.refresh-token-expiration=604800000
taskflow.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# ── TaskFlow App Settings ───────────────────────────────────────────────────
taskflow.app.name=TaskFlow
taskflow.app.url=http://localhost:3000
taskflow.app.api-url=http://localhost:8080

# ── SpringDoc OpenAPI Swagger ───────────────────────────────────────────────
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
springdoc.swagger-ui.operations-sorter=method
